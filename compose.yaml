name: jaybase

services:
  jaybase:
    build:
      context: .
    restart: unless-stopped
    environment:
      JAYBASE_LISTEN_ADDR: :8080
      JAYBASE_DATA_DIR: /var/lib/jaybase
      JAYBASE_BACKUP_DIR: /var/backups/jaybase
      JAYBASE_DATA_KEY_FILE: /run/secrets/jaybase_data_key
      JAYBASE_AUTH_FILE: /run/secrets/jaybase_auth
    secrets:
      - jaybase_data_key
      - jaybase_auth
    volumes:
      - jaybase_data:/var/lib/jaybase
      - jaybase_backups:/var/backups/jaybase
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1700,uid=65532,gid=65532
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/jaybase-server", "healthcheck", "http://127.0.0.1:8080/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    depends_on:
      jaybase:
        condition: service_healthy
    environment:
      JAYBASE_DOMAIN: ${JAYBASE_DOMAIN:?set JAYBASE_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1700
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

secrets:
  jaybase_data_key:
    file: ./secrets/data_key
  jaybase_auth:
    file: ./secrets/auth.json

volumes:
  jaybase_data:
  jaybase_backups:
  caddy_data:
  caddy_config:
